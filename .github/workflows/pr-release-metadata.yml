name: PR
on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate:
    name: Validate Release Label and Notes
    runs-on: ubuntu-latest
    # Dependabot PRs can't read repo secrets and don't need to be gated on
    # release metadata; we apply the right label automatically via dependabot.yml.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        name: Validate PR metadata
        with:
          mode: validate
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: true
          release-notes-prefix: '### RELEASE NOTES'
          with-v: true
