name: Master CI
on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: npm test

  bump-version:
    name: Tag New Release Version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release-notes: ${{ steps.bump.outputs.release-notes }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - id: bump
        uses: ./
        name: Bump and Tag New Release Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: true
          release-notes-prefix: '### RELEASE NOTES'
          with-v: true

  publish-release:
    name: Publish GitHub Release and advance v1
    runs-on: ubuntu-latest
    needs: bump-version
    if: needs.bump-version.outputs.skipped != 'true' && needs.bump-version.outputs.version != ''
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release for ${{ needs.bump-version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-version.outputs.version }}
          NOTES: ${{ needs.bump-version.outputs.release-notes }}
        run: |
          # Skip silently if a release already exists for this tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; skipping."
            exit 0
          fi
          printf '%s\n' "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Advance floating major-version tag (e.g. v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-version.outputs.version }}
        run: |
          # Extract the major prefix (v1.2.3 -> v1). Bail if the tag isn't of
          # that shape so we don't accidentally write to an unexpected ref.
          MAJOR=$(echo "$TAG" | sed -nE 's/^(v[0-9]+)\..*/\1/p')
          if [ -z "$MAJOR" ]; then
            echo "Tag $TAG doesn't match vN.x.y; not advancing a major-version tag."
            exit 0
          fi
          echo "Advancing $MAJOR -> $GITHUB_SHA"
          # Force-update the lightweight ref. -f works whether the tag exists or not.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
